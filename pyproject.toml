[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-agent"
version = "0.1.0"
description = "A production-minded agentic research pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "google-genai",
    "groq",
    "httpx",
    "tenacity",
    "trafilatura",
    "ddgs",
    "fastapi",
    "uvicorn",
    "rich",
    "pyyaml",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[project.scripts]
research-agent = "app.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

